name: Build Aura OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Archiso in Docker
        run: |
          docker run --rm --privileged -v ${{ github.workspace }}:/workspace -w /workspace archlinux:latest bash -c "
            # 1. تهيئة المفاتيح
            pacman-key --init
            pacman-key --populate archlinux
            
            # 2. تحديث قاعدة البيانات وتثبيت archiso
            pacman -Syu --noconfirm archiso

            # 3. بدء البناء
            mkarchiso -v -o /workspace/out /workspace
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-OS-ISO
          path: out/*.iso

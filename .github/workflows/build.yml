name: Build Aura OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Archiso in Docker
        run: |
          docker run --rm --privileged -v ${{ github.workspace }}:/workspace -w /workspace archlinux:latest bash -c "
            # 1. تهيئة مفاتيح Arch Linux
            pacman-key --init
            pacman-key --populate archlinux
            
            # 2. تثبيت مفاتيح وقائمة سيرفرات Chaotic-AUR رسمياً
            pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
            pacman-key --lsign-key 3056513887B78AEB
            pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
            pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
            
            # 3. تحديث النظام وتثبيت archiso
            pacman -Syu --noconfirm archiso
            
            # 4. بناء الـ ISO
            mkarchiso -v -o /workspace/out /workspace
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-OS-ISO
          path: out/*.iso
